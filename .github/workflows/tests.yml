name: Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: schoolsafe_test
      DB_USERNAME: schoolsafe
      DB_PASSWORD: schoolsafe

      BCRYPT_ROUNDS: '4'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    services:
      mariadb:
        image: mariadb:10.11

        env:
          MARIADB_DATABASE: schoolsafe_test
          MARIADB_USER: schoolsafe
          MARIADB_PASSWORD: schoolsafe
          MARIADB_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pdo_mysql, curl, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install Node Dependencies
        run: npm ci

      - name: Clear Laravel Cache
        run: php artisan optimize:clear

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Run Frontend Tests
        run: npm run test:frontend

      - name: Check TypeScript
        run: npm run types:check

      - name: Build Production Assets
        run: npm run build

      - name: Run Laravel Tests
        run: php artisan test
